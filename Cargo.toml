[package]
name = "core-reactor-kv"
authors = ["Deepak Singh <dsinghrana71@gmail.com>"]
version = "0.1.0"
edition = "2024"
description = "A thread-per-core, shared-nothing distributed key-value store utilizing edge-triggered epoll/io_uring reactors."

[dependencies]
core_affinity = "0.8.3"
glommio = "=0.9.0"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["event"] }
socket2 = { version = "0.5", features = ["all"] }
rand = "0.9"
tonic = "0.14.4"
prost = "0.14.4"
tonic-prost = "0.14.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
crossbeam-channel = "0.5.17"


[build-dependencies]
tonic-prost-build = "0.14.4" 

[[bin]]
name = "core-reactor-kv"
path = "src/main.rs"

[[bin]]
name = "cluster_launcher"
path = "src/bin/cluster_launcher.rs"
